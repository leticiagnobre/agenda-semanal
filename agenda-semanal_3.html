<html lang="pt-BR">

<meta charset="UTF-8">

<title>Pauta da Semana</title>

<style>
  :root{
    --ink:#14171C;
    --ink-2:#1E2229;
    --paper:#F5F3EC;
    --paper-dim:#C9C6BA;
    --stamp:#C23B22;
    --mustard:#D9A404;
    --teal:#4C7A7D;
    --line: rgba(245,243,236,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Source Serif 4', serif;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .masthead{
    max-width:960px;
    margin:0 auto 20px;
    border-bottom:3px double var(--paper-dim);
    padding-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .masthead h1{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:clamp(28px,4vw,44px);
    font-weight:700;
    margin:0;
  }
  .masthead .edition{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--paper-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .wrap{ max-width:960px; margin:0 auto; }

  /* Tabs — styled like press credential tabs */
  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:0;
    position:relative;
    z-index:1;
  }
  .tab-btn{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    background:var(--ink);
    color:var(--paper-dim);
    border:1px solid var(--line);
    border-bottom:none;
    padding:9px 14px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    transition:color 0.15s, background 0.15s;
  }
  .tab-btn .n{
    opacity:0.6;
    margin-left:5px;
  }
  .tab-btn:hover{ color:var(--paper); }
  .tab-btn.active{
    background:var(--ink-2);
    color:var(--paper);
    border-color:var(--line);
  }
  .tab-btn.active::after{
    content:"";
  }

  .panel{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:0 2px 2px 2px;
    padding:22px 22px 26px;
    display:none;
  }
  .panel.active{ display:block; }

  .panel h2{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:17px;
    font-weight:600;
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel h2::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .stamp-tag{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:2px 6px;
    border-radius:2px;
    text-transform:uppercase;
  }

  /* Calendar */
  .week{ display:flex; flex-direction:column; gap:2px; }
  .day{
    display:grid;
    grid-template-columns:86px 1fr;
    border-bottom:1px solid var(--line);
    padding:10px 0;
    gap:12px;
  }
  .day:last-child{border-bottom:none;}
  .day-label{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--paper-dim);
    padding-top:2px;
  }
  .day-label small{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    opacity:0.7;
    letter-spacing:0;
    margin-top:2px;
  }
  .events{ display:flex; flex-direction:column; gap:6px; }
  .event{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:3px 6px 3px 10px;
    margin-left:-6px;
    border-left:3px solid var(--client-color, var(--teal));
    flex-wrap:wrap;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.12s;
  }
  .event:hover{
    background:rgba(245,243,236,0.06);
  }
  .event .time{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--paper);
    opacity:0.85;
    white-space:nowrap;
  }
  .event .desc{ font-size:14.5px; line-height:1.35; }
  .event .client{
    font-family:'Space Mono', monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--client-color, var(--teal));
    font-weight:700;
  }
  .event .sep{
    color:var(--paper-dim);
    opacity:0.5;
    font-size:12px;
  }
  .empty-day, .empty-state{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--paper-dim);
    opacity:0.5;
    font-style:italic;
  }

  /* Task list (shared by "Lista completa" and each status tab) */
  .task-list{ display:flex; flex-direction:column; gap:10px; }
  .task-row{
    background:var(--paper);
    color:var(--ink);
    border-radius:1px;
    padding:11px 13px 12px;
    border-left:4px solid var(--client-color, var(--teal));
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
  }
  .task-row .top-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .task-row .client{
    font-family:'Space Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--client-color, var(--teal));
  }
  .task-row .status-pill{
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#5a564a;
    border:1px solid #5a564a;
    border-radius:2px;
    padding:1px 6px;
  }
  .task-row .desc{
    font-size:14.5px;
    margin-top:5px;
    line-height:1.35;
  }
  .task-row .meta-line{
    display:flex;
    gap:14px;
    margin-top:7px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:#5a564a;
    flex-wrap:wrap;
  }
  .task-row .notes{
    margin-top:6px;
    font-family:'Source Serif 4', serif;
    font-size:12.5px;
    color:#4a463c;
    font-style:italic;
    border-top:1px dashed #cfcabb;
    padding-top:6px;
  }

  /* Modal de detalhe do item (clique no evento do Resumo) */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--paper);
    color:var(--ink);
    max-width:420px;
    width:100%;
    border-radius:2px;
    padding:20px 22px 22px;
    border-left:5px solid var(--modal-color, var(--teal));
    position:relative;
  }
  .modal-card .m-client{
    font-family:'Space Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--modal-color, var(--teal));
    font-weight:700;
  }
  .modal-card .m-when{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#5a564a;
    margin-top:2px;
  }
  .modal-card .m-desc{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    font-weight:600;
    margin-top:10px;
    line-height:1.3;
  }
  .modal-card .m-notes{
    font-family:'Source Serif 4', serif;
    font-size:13.5px;
    color:#4a463c;
    margin-top:10px;
    line-height:1.4;
    border-top:1px dashed #cfcabb;
    padding-top:10px;
  }
  .modal-card .m-link{
    display:block;
    margin-top:12px;
    font-family:'Space Mono', monospace;
    font-size:12px;
  }
  .modal-card .m-link a{ color:var(--modal-color, var(--teal)); }
  .modal-card .m-link.empty{ color:#a39d8c; font-style:italic; }
  .modal-close{
    position:absolute;
    top:10px; right:12px;
    background:none;
    border:none;
    font-size:18px;
    color:#8a8574;
    cursor:pointer;
    line-height:1;
  }

  footer{
    max-width:960px;
    margin:24px auto 0;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    opacity:0.5;
    text-align:center;
  }
</style>
</head>

// Boletim FENEP — gerado automaticamente todo mês (última sexta do mês = entrega)
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(d){ return pad(d.getDate()) + "/" + pad(d.getMonth()+1); }
function lastFridayOfMonth(year, month0){
  const d = new Date(year, month0 + 1, 0); // último dia do mês
  const diff = (d.getDay() - 5 + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d;
}
function generateBoletimTasks(){
  const tasks = [];
  const base = new Date(2026, 6, 1); // julho/2026 = Boletim #6
  for (let i = 0; i < 3; i++){
    const year = base.getFullYear();
    const month0 = base.getMonth() + i;
    const entrega = lastFridayOfMonth(year, month0);
    const aprovacao = new Date(entrega); aprovacao.setDate(entrega.getDate() - 4);
    const envio = new Date(entrega); envio.setDate(entrega.getDate() - 2);
    const prePauta = new Date(aprovacao); prePauta.setDate(aprovacao.getDate() - 4);
    const num = 6 + i;
    tasks.push(
      { client: "Fenep", desc: `Boletim #${num} — pré-pauta`, status: "A fazer", deadline: fmtDate(prePauta), notes: "" },
      { client: "Fenep", desc: `Boletim #${num} — aprovação`, status: "A fazer", deadline: fmtDate(aprovacao), notes: "" },
      { client: "Fenep", desc: `Boletim #${num} — envio dos textos + diagramação`, status: "A fazer", deadline: fmtDate(envio), notes: "" },
      { client: "Fenep", desc: `Boletim #${num} — entrega`, status: "A fazer", deadline: fmtDate(entrega) + " (manhã)", notes: "" }
    );
  }
  return tasks;
}
const ALL_TASKS = TASKS.concat(generateBoletimTasks());

const STATUS_ORDER = ["A fazer", "Em andamento", "Aguardando", "Someday", "Concluído"];

/* ============================================================
   ABAS
   ============================================================ */

const TABS = [
  { id: "resumo", label: "Resumo" },
  { id: "lista",  label: "Lista completa" },
  ...STATUS_ORDER.map(s => ({ id: "status-" + s.replace(/\s|\//g,"-"), label: s, status: s }))
];

function colorFor(client){
  return CLIENT_COLORS[client] || "#4C7A7D";
}

function renderWeekBlock(days, sourceKey){
  return `
    <div class="week">
      ${days.map((d, di) => `
        <div class="day">
          <div class="day-label">${d.day}<small>${d.date}</small></div>
          <div class="events">
            ${
              d.events.length
                ? d.events.map((ev, ei) => `
                  <div class="event" style="--client-color:${colorFor(ev.client)}" data-src="${sourceKey}" data-day="${di}" data-ev="${ei}">
                    ${ev.time ? `<span class="time">${ev.time}</span><span class="sep">–</span>` : ""}
                    <span class="client">${ev.client}</span><span class="sep">–</span>
                    <span class="desc">${ev.desc}</span>
                  </div>
                `).join("")
                : `<div class="empty-day">Nada marcado</div>`
            }
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderWeekPanel(){
  return `
    <h2>Compromissos &amp; Deadlines <span class="stamp-tag">Semana</span></h2>
    ${renderWeekBlock(WEEK, "WEEK")}
    <h2 style="margin-top:22px;">Semana Seguinte <span class="stamp-tag">Prévia</span></h2>
    ${renderWeekBlock(NEXT_WEEK, "NEXT_WEEK")}
  `;
}

function renderTaskRow(t){
  return `
    <div class="task-row" style="--client-color:${colorFor(t.client)}">
      <div class="top-line">
        <span class="client">${t.client}</span>
        <span class="status-pill">${t.status}</span>
      </div>
      <div class="desc">${t.desc}</div>
      <div class="meta-line">
        <span>Prazo: ${t.deadline || "—"}</span>
      </div>
      ${t.notes ? `<div class="notes">${t.notes}</div>` : ""}
    </div>
  `;
}

function renderListPanel(items, emptyLabel, title){
  return `
    <h2>${title}</h2>
    <div class="task-list">
      ${
        items.length
          ? items.map(renderTaskRow).join("")
          : `<div class="empty-state">${emptyLabel}</div>`
      }
    </div>
  `;
}

function renderAll(){
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  tabsEl.innerHTML = TABS.map((t, i) => {
    const count = t.status ? ALL_TASKS.filter(x => x.status === t.status).length : null;
    return `<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}${count!==null ? `<span class="n">${count}</span>` : ""}</button>`;
  }).join("");

  panelsEl.innerHTML = TABS.map((t, i) => {
    let inner;
    if (t.id === "resumo") inner = renderWeekPanel();
    else if (t.id === "lista") inner = renderListPanel(ALL_TASKS, "Nenhuma tarefa cadastrada", "Lista completa de tarefas");
    else inner = renderListPanel(ALL_TASKS.filter(x => x.status === t.status), "Nenhuma tarefa nesta coluna", t.status);
    return `<div class="panel${i===0?' active':''}" data-panel="${t.id}"><div class="panel-inner">${inner}</div></div>`;
  }).join("");

  tabsEl.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      tabsEl.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      panelsEl.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panelsEl.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add("active");
    });
  });
}

document.getElementById("last-updated").textContent = "Atualizado em " + LAST_UPDATED;

renderAll();

/* ============================================================
   MODAL — clique num item do Resumo para ver detalhe/observações/link
   ============================================================ */

function openEventModal(sourceKey, dayIdx, evIdx){
  const days = sourceKey === "NEXT_WEEK" ? NEXT_WEEK : WEEK;
  const day = days[dayIdx];
  const ev = day.events[evIdx];
  if (!ev) return;

  document.getElementById("modal-card").style.setProperty("--modal-color", colorFor(ev.client));
  document.getElementById("modal-client").textContent = ev.client;
  document.getElementById("modal-when").textContent = `${day.day} · ${day.date}${ev.time ? " · " + ev.time : ""}`;
  document.getElementById("modal-desc").textContent = ev.desc;
  document.getElementById("modal-notes").textContent = ev.notes || "Sem observações adicionais.";

  const linkEl = document.getElementById("modal-link");
  if (ev.link){
    linkEl.className = "m-link";
    linkEl.innerHTML = `<a href="${ev.link}" target="_blank" rel="noopener">${ev.link}</a>`;
  } else {
    linkEl.className = "m-link empty";
    linkEl.textContent = "Sem link cadastrado ainda.";
  }

  document.getElementById("modal-overlay").classList.add("open");
}

function closeEventModal(){
  document.getElementById("modal-overlay").classList.remove("open");
}

document.getElementById("panels").addEventListener("click", (e) => {
  const el = e.target.closest(".event");
  if (!el) return;
  openEventModal(el.dataset.src, Number(el.dataset.day), Number(el.dataset.ev));
});

document.getElementById("modal-close").addEventListener("click", closeEventModal);
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeEventModal();
});
